 if(cloud){const fresh=state.session?.cloudAuth||state.cloudAuth?await cloudRefresh(false):null;url=`${cloud.url}/functions/v1/${cloud.functionName}/api${path}`;headers.apikey=cloud.publishableKey;const token=fresh?.access_token||state.session?.token||state.cloudAuth?.access_token;if(token)headers.Authorization='Bearer '+token}
 else if(state.session?.token)headers.Authorization='Bearer '+state.session.token;
 if(body!==undefined)headers['Content-Type']='application/json';let response;
 try{response=await fetch(url,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body),...opts})}
 catch(e){state.online=false;const failure=new Error('No se pudo conectar al servidor. Tus datos locales siguen guardados.');failure.code='network_error';failure.retryable=true;throw failure}
 state.online=true;
 if(!response.ok){let error;try{error=await response.json()}catch{error={error:'Error del servidor ('+response.status+')'}}const e=new Error(error.error||'La operación no pudo completarse.');e.code=error.code;e.status=response.status;e.retryable=response.status===408||response.status===425||response.status===429||response.status>=500;throw e}
 return response.json();
}
async function api(path,body,opts={}){
 try{return await requestApi(path,body,opts)}catch(first){
  if(!cloud||opts.noRecovery||path==='/login'||path==='/session/renew'||state.session?.user.admin||!(first.status===401||first.code==='counter_session_revoked')){
   if(state.session&&(first.status===401||first.code==='counter_session_revoked')){state.session.expired=true;await put('session',state.session)}throw first;
  }
  try{
   if(first.status===401)await cloudRefresh(true);
   try{return await requestApi(path,body,opts)}catch(second){
    if(!(second.status===401||second.code==='counter_session_revoked'))throw second;
    await renewCounterSession();
    return await requestApi(path,body,opts);
   }
  }catch(recovery){
   if(state.session){state.session.expired=true;await put('session',state.session)}
   const failure=new Error('La conexión segura requiere atención. Tus conteos siguen guardados en este dispositivo.');failure.status=recovery.status||first.status;failure.code=recovery.code||first.code;throw failure;
  }
 }
}
async function loadQueue(){state.queue=(await all('operations')).filter(o=>!o.resolved).sort(operationOrder)}
async function refresh(silent=false){if(!state.session)return false;const sessionId=state.session.user.id;try{const data=await api('/state');if(!state.session||state.session.user.id!==sessionId)return false;state.data=data;state.session.expired=false;state.session.user=data.user;await put('session',state.session);await put('snapshot:'+data.user.id,data);if(state.period&&!data.periods.some(p=>String(p.id)===String(state.period))){state.period=null;state.warehouse=null}for(const w of data.warehouses||[]){const part=(w.participants||[]).find(p=>p.session_id===data.user.id);const k=key(w.period_id,w.code);if(part&&!part.finished&&!part.retired&&w.status!=='closed')state.joined[k]=true;else delete state.joined[k]}await put('joined:'+state.session.user.id,state.joined);if(!silent)render();return true}catch(e){if(!silent)toast(e.message,true);if((e.status===401||e.code==='counter_session_revoked')&&state.session?.user.id===sessionId){state.session.expired=true;await put('session',state.session)}if(!silent)render();return false}}
async function ensureParticipation(periodId=state.period,warehouse=state.warehouse,force=false){
 const membershipKey=key(periodId,warehouse);
 if(state.joined[membershipKey]&&!force)return true;
 if(!state.online||!navigator.onLine)return false;
 if(!periodId||!warehouse)throw new Error('Seleccione una bodega disponible para contar.');
 if(joinRuns.has(membershipKey))return joinRuns.get(membershipKey);
 const run=(async()=>{
  const result=await api('/join',{period_id:periodId,warehouse});
  if(result?.ok!==true||result.session_id!==state.session?.user.id)throw new Error('No se pudo habilitar el conteo en esta bodega. Inténtelo cuando recupere conexión.');
  state.joined[membershipKey]=true;await put('joined:'+state.session.user.id,state.joined);
  await del(`finish-lock:${state.session.user.id}:${membershipKey}`);
  state.finishing=false;
  return true;
 })().finally(()=>joinRuns.delete(membershipKey));
 joinRuns.set(membershipKey,run);return run;
}async function loadScope(){state.finishing=!!await get(`finish-lock:${state.session.user.id}:${key()}`);state.selected=null;state.query='';if(state.online&&!isClosed())await ensureParticipation();state.catalog=await cachedCatalog();if(state.online){try{const c=await api('/catalog?period_id='+encodeURIComponent(state.period)+'&warehouse='+encodeURIComponent(state.warehouse));state.catalog=cleanCatalog(c.rows||[]);await put(catalogKey(),{rows:state.catalog})}catch(e){toast(e.message,true)}}await loadRecords();mergePendingArticles();}
async function loadRecords(){if(state.online){try{const result=await api('/records?period_id='+encodeURIComponent(state.period)+'&warehouse='+encodeURIComponent(state.warehouse));const queuedIds=new Set(scopePending().map(o=>o.record_id));await atomic(['records'],t=>{for(const r of result.records||[]){if(queuedIds.has(r.id))continue;const item={...r,period_id:state.period,warehouse:state.warehouse,local_key:recordKey({...r,period_id:state.period,warehouse:state.warehouse}),synced:true};t.objectStore('records').put(item)}})}catch(e){if(e.status!==401)toast(e.message,true)}}state.records=(await all('records')).filter(r=>String(r.period_id)===String(state.period)&&r.warehouse===state.warehouse&&(state.session.user.admin||r.owner_id===state.session.user.id)).sort((a,b)=>(b.updated_at||b.created_at||'').localeCompare(a.updated_at||a.created_at||''));}

function render(){if(!state.session){renderLogin();return}const user=state.session.user;const q=pending();const nav=[['periods','▦','Inventarios'],['warehouses','▤','Bodegas'],['count','＋','Contar'],['records','≡','Mis registros'],['sync','⇅','Sincronización']];if(user.admin)nav.push(['admin','⚙','Administración']);const names={periods:'Inventarios mensuales',warehouses:'Bodegas',count:'Conteo físico',records:'Mis registros',sync:'Sincronización',admin:'Administración',consolidation:'Consolidación',reports:'Reportes y firmas',history:'Historial'};$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">i</span>inventario<span style="color:#78b3a8">.</span></div><nav class="nav" aria-label="Navegación principal">${nav.map(([page,icon,name])=>`<button class="${state.page===page?'active':''}" data-action="nav" data-page="${page}" ${state.page===page?'aria-current="page"':''}><span class="icon" aria-hidden="true">${icon}</span>${name}${page==='sync'&&user.admin&&q.length?`<span class="pending-count">${q.length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="person">${esc(user.name)}</div><div class="role">${user.admin?'Administración':'Contador'} · ${esc(user.device_id?.slice(-6)||'Este dispositivo')}</div><button data-action="identity">Cambiar identificación →</button>${state.install?button('Instalar aplicación','install','','small install'):''}</div></aside><main class="main"><div class="topbar"><div class="crumb">Inventario físico <span style="padding:0 10px;color:#bcc9d2">/</span> ${esc(names[state.page]||'Inventarios')}${state.period?' / '+esc(periodName()):''}</div><div class="brand mobile-brand"><span class="brand-mark">i</span></div><div class="top-status">${window.INVENTORY_DEVELOPMENT?'<span class="dev-mark">DESARROLLO</span>':''}<span class="status ${!state.online?'offline':''}"><span class="dot"></span>${state.online?'Conectado':'Sin conexión'}</span><span class="badge ${state.o function requireOnline(){if(!state.online||!navigator.onLine)throw new Error('Esta operación necesita conexión con el servidor.');if(state.session.expired)throw new Error('Renueva la sesión para realizar esta operación.');}

function wireOperation(op){const fields=['name','zero_confirmed','id','kind','period_id','warehouse','record_id','code','presentation','quantity','zone','revision','reason'];return Object.fromEntries(fields.filter(k=>op[k]!==undefined).map(k=>[k,op[k]]));}

let syncRun=null;
function sync(manual=false,force=false){if(syncRun)return syncRun;syncRun=performSync(manual,force).finally(()=>{syncRun=null});return syncRun;}
function autoRecoverableQueued(op){return ['device_not_active','internal','temporarily_unavailable'].includes(op?.error_code)}
function syncDelay(attempt){return Math.min(120000,2000*Math.pow(2,Math.min(Math.max(0,attempt-1),6)))}
function isTransientSyncError(error){return error?.retryable===true||error?.code==='internal'||error?.code==='temporarily_unavailable'||[408,425,429].includes(error?.status)||error?.status>=500||error?.code==='network_error'}
async function keepForRetry(op,error){op.status='pending';op.retry_attempt=(Number(op.retry_attempt)||0)+1;op.next_retry_at=Date.now()+syncDelay(op.retry_attempt);op.retry_reason=error?.code||'temporary';op.error=null;await atomic(['operations'],t=>t.objectStore('operations').put(op));}
async function acceptSyncItem(op,item){await atomic(['operations','records'],t=>{t.objectStore('operations').delete(op.id);if(item.record&&!pending().some(later=>later.record_id===op.record_id&&later.id!==op.id&&operationOrder(later,op)>0)){const r={...item.record,period_id:op.period_id,warehouse:op.warehouse,device_id:op.device_id,synced:true};r.local_key=recordKey(r);t.objectStore('records').put(r)}})}
async function recoverInactiveOperation(op){
 if(!state.online||!navigator.onLine)return false;
 const didJoin=await ensureParticipation(op.period_id,op.warehouse,true);
 if(!didJoin)return false;
 const response=await api('/sync',{operations:[wireOperation(op)]});
 const item=response.results?.find(result=>result.id===op.id);
 if(!item)throw new Error('El servidor aún no confirmó el registro. Se conservará para el siguiente intento.');
 if(item.status==='ok'){await acceptSyncItem(op,item);return true;}
 op.status=item.status;op.error=item.error||'La operación requiere revisión.';op.error_code=item.code;op.server_record=item.record;await atomic(['operations'],t=>t.objectStore('operations').put(op));return false;
}
async function performSync(manual=false,force=false){if(!state.online||!navigator.onLine)throw new Error('No hay conexión. Los registros permanecen guardados en este dispositivo.');state.syncing=true;try{

    break;
   }
   if(item.code==='device_not_active'){

    const recovered=await recoverInactiveOperation(op);if(!recovered) {await keepForRetry(op,{code:'device_not_active'});break;}continue;
   }

  }catch(error){
   if(isTransientSyncError(error)){for(const retryOp of operations.slice(index))await keepForRetry(retryOp,error);if(!state.online)break;break;}

async function correction(id){const r=state.records.find(x=>x.id===id);if(!r)throw new Error('No se encontró el registro.');if(r.owner_id!==state.session.user.id)throw new Error('Solo el contador original puede corregir este registro.');if(isClosed())throw new Error('La bodega está cerrada.');if(!canCount())throw new Error('Reanuda la participación del dispositivo para corregir. Los reportes definitivos bloquean las correcciones.');if(scopePending().some(o=>o.record_id===id&&['error','conflict'].includes(o.status)&&!autoRecoverableQueued(o)))throw new Error('Este registro requiere revisión administrativa antes de corregirse.');dialog('Corregir registro',`<p class="section-caption">${esc(r.name||r.code)} · ${esc(r.presentation)}<br>Cantidad actual: <strong>${esc(r.quantity)}</strong>. La nueva cantidad reemplaza este valor.</p><div class="field"><label for="correction-quantity">Nueva cantidad</label><input id="correction-quantity" name="quantity" inputmode="decimal" value="${esc(r.quantity)}" required></div><div class="field"><label for="correction-reason">Motivo de la corrección</label><textarea id="correction-reason" name="reason" required minlength="3" maxlength="500" placeholder="Explica por qué cambia la cantidad"></textarea></div>`,'Confirmar corrección',async fd=>{const quantity=decimal(fd.get('quantity'));const zero_confirmed=Number(quantity)===0;if(zero_confirmed&&!confirm('¿Confirma la cantidad física cero para este registro?'))return;const reason=String(fd.get('reason')).trim();if(reason.length<3)throw new Error('Indica el motivo de la corrección.');const now=new Date().toISOString();const operation={id:uid(),kind:'correct',zero_confirmed,period_id:state.period,warehouse:state.warehouse,record_id:r.id,code:r.code,presentation:r.presentation,quantity,zone:r.zone||'',revision:r.revision||0,reason,created:now,owner_id:state.session.user.id,owner_name:state.session.user.name,device_id:state.session.user.device_id,status:'pending'};const revised={...r,quantity,revision:(r.revision||0)+1,synced:false,updated_at:now,history:[...(r.history||[]),{old_quantity:r.quantity,new_quantity:quantity,reason,at:now,name:state.session.user.name,local:true}]};await saveQueuedOperations([operation],[revised]);state.records=state.records.map(x=>x.id===r.id?revised:x);await loadQueue();$('#modal').close();render();toast('Corrección guardada. Se conserva la cantidad anterior en el historial.');if(state.online)sync().catch(()=>{});});}
async function resolveOperation(id){const op=state.queue.find(o=>o.id===id);if(!op)return;let server=op.server_record;if(state.online&&op.kind==='correct'){const response=await api('/records?period_id='+op.period_id+'&warehouse='+encodeURIComponent(op.warehouse));server=response.records.find(r=>r.id===op.record_id)||server;}dialog('Revisar operación pendiente',`<p class="section-caption">${esc(op.error)}<br>Artículo ${esc(op.code)} · cantidad local ${esc(op.quantity)}</p>${server?notice('Cantidad actual en el servidor: <strong>'+esc(server.quantity)+'</strong> · revisión '+esc(server.revision)):''}<div class="field"><label for="resolution">Decisión</label><select name="decision" id="resolution"><option value="retry">${op.error_code==='device_not_active'?'Reincorporarme y reintentar esta misma operación':'Reintentar después de comprobar la causa'}</option>${op.kind==='correct'&&server?'<option value="rebase">Aplicar corrección sobre la revisión actual del servidor</option>':''}<option value="archive">Conservar operación en historial local sin reenviarla</option></select></div><div class="field"><label for="resolution-reason">Motivo de la decisión</label><textarea id="resolution-reason" name="reason" minlength="3" required></textarea></div><p class="small muted">Archivar deja constancia local. Las cantidades archivadas no se incorporan al resultado del servidor.</p>`,'Aplicar decisión',async fd=>{const decision=fd.get('decision'),reason=String(fd.get('reason')).trim();if(reason.length<3)throw new Error('Indica un motivo.');const now=new Date().toISOString();if(op.error_code==='device_not_active'&&decision==='retry'){requireOnline();await api('/join',{period_id:op.period_id,warehouse:op.warehouse});state.joined[key(op.period_id,op.warehouse)]=true;await put('joined:'+state.session.user.id,state.joined);const response=await api('/sync',{operations:[wireOperation(op)]});const retried=response.results?.find(item=>item.id===op.id);if(!retried)throw new Error('El servidor no confirmó el reintento; se conserva la operación con el mismo identificador.');if(retried.status==='ok'){await atomic(['operations','records'],t=>{t.objectStore('operations').delete(op.id);if(retried.record){const r={...retried.record,period_id:op.period_id,warehouse:op.warehouse,device_id:op.device_id,synced:true};r.local_key=recordKey(r);t.objectStore('records').put(r)}});await refresh(true);await loadRecords();await loadQueue();$('#modal').close();render();toast('Conteo sincronizado con el mismo identificador.');return;}op.status=retried.status;op.error=retried.error||'La operación requiere revisión.';op.error_code=retried.code;await atomic(['operations'],t=>t.objectStore('operations').put(op));await loadQueue();throw new Error(op.error);}if(op.error_code==='revision_conflict'){requireOnline();await api('/conflicts/resolve',{operation_id:op.id,reason});}const changes=[];const old={...op,resolved:true,resolution:decision,resolution_reason:reason,resolved_at:now};if(decision==='archive')changes.push(old);else{changes.push(old);const next={...op,id:uid(),created:now,status:'pending',error:null};delete next.sequence;if(op.error_code==='zero_confirmation_required'){if(!confirm('¿Confirma físicamente que la cantidad de este registro es cero?'))return;next.zero_confirmed=true;}if(decision==='rebase'){changes.push(old);next.id=uid();next.revision=server.revision;next.reason=op.reason+' · Resolución: '+reason;next.created=now;delete next.resolved}changes.push(next)}const recordUpdates=[];if(decision==='archive'&&server){const r={...server,period_id:op.period_id,warehouse:op.warehouse,device_id:op.device_id,synced:true};r.local_key=recordKey(r);recordUpdates.push(r);}else if(decision==='archive'){const r=state.records.find(x=>x.id===op.record_id);if(r)recordUpdates.push({...r,archived:true,synced:false});}await saveQueuedOperations(changes,recordUpdates);await loadQueue();await loadRecords();$('#modal').close();render();toast('Decisión guardada.');if(decision!=='archive'&&state.online)sync().catch(()=>{});});}
async function importDialog(){if(!state.period)throw new Error('Selecciona primero un período mensual.');requireOnline();state.preview=null;dialog('Importar inventarios XLS',`<p class="section-caption">${esc(periodName())}. Selecciona los archivos exportados por el sistema, uno por bodega. La bodega se identifica en el contenido.</p><div class="field"><label for="import-scope">Ámbito de bodega</label><select id="import-scope" name="scope"><option value="">Detectar automáticamente</option><option value="ADCOSA">ADCOSA</option><option value="CLUB">CLUB</option></select><span class="help">Los códigos 210, 300, 320 y 400 están compartidos entre empresas y requieren elegir ADCOSA o CLUB.</span></div><div class="file-drop"><div class="field"><label for="import-files">Archivos XLS</label><input id="import-files" type="file" name="files" accept=".xls" multiple required></div></div><div id="import-preview"></div>`,'Analizar archivos',async(fd,m)=>{const selected=$('#import-files',m).files;if(!selected.length)throw new Error('Selecciona al menos un archivo.');if(Array.from(selected).reduce((total,f)=>total+f.size,0)>20*1024*1024)throw new Error('El lote supera 20 MB. Divide los archivos en varios lotes.');const files=[];for(const f of selected){if(f.size>10*1024*1024)throw new Error('El archivo '+f.name+' supera 10 MB.');files.push({name:f.name,data:await fileBase64(f)})}state.preview=await api('/import/preview',{period_id:state.period,files,scope:fd.get('scope')||''});renderPreview(m);});}
function fileBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(new Error('No se pudo leer '+file.name));r.readAsDataURL(file)})}
function renderPreview(m){const p=state.preview;const errorList=(errors)=>errors.map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('');$('#import-preview',m).innerHTML=`<h3>Informe previo</h3>${p.files.map(f=>`<div class="preview-file"><div class="card-title"><h3>${esc(f.warehouse_code||'Bodega sin identificar')} · ${esc(f.warehouse_name||'')}</h3>${f.duplicate?'<span class="badge amber">Duplicado</span>':'<span class="badge blue">Analizado</span>'}</div><p class="small muted">${esc(f.name||'')} · ${f.rows_count||0} líneas válidas</p><div class="chip-row"><span class="badge green">${f.new_articles||0} artículos nuevos</span><span class="badge blue">${f.new_combinations||0} combinaciones nuevas</span><span class="badge">${f.changed||0} cambios</span></div>${f.errors?.length?`<ul style="color:var(--red)">${errorList(f.errors)}</ul>`:''}${f.warnings?.length?`<ul style="color:var(--amber)">${errorList(f.warnings)}</ul>`:''}</div>`).join('')}${p.errors?.length?notice('<ul>'+errorList(p.errors)+'</ul>','red'):''}<p class="small muted">La confirmación incorpora el lote en una única transacción. Cualquier error de integridad impide la importación.</p>`;const form=$('#dialog-form',m);$('.dialog-actions',m).innerHTML=button('Cancelar','modal-close')+`<button class="button primary" type="submit" ${(p.errors?.length||p.files.some(f=>f.errors?.length))?'disabled':''}>Confirmar importación</button>`;form.onsubmit=async e=>{e.preventDefault();const btn=$('button[type=submit]',m);btn.disabled=true;try{await adminMutation('/import/commit',{preview_id:p.preview_id},'Inventarios importados correctamente.');m.close();state.page='warehouses';render()}catch(error){toast(error.message,true)}finally{btn.disabled=false}};}
async function signatureDialog(reportId){requireOnline();const report=currentWarehouse()?.reports?.find(r=>String(r.id)===String(reportId));if(!report)throw new Error('No se encontró el reporte.');const existing=new Set((report.signatures||[]).map(s=>s.role));const options=[['performed','Realizado por'],['reviewed','Revisado por']].filter(([role])=>!existing.has(role));if(!options.length)throw new Error('Este reporte ya contiene las dos firmas.');const m=dialog('Firmar reporte definitivo',`<p class="section-caption">Bodega ${esc(state.warehouse)} · ${esc(periodName())} · versión ${report.version}</p><div class="field"><label for="signature-role">Función de la firma</label><select name="role" id="signature-role">${options.map(([role,name])=>`<option value="${role}">${name}</option>`).join('')}</select></div><div class="field"><label for="signature-name">Nombre de quien firma</label><input name="name" id="signature-name" autocomplete="name" required maxlength="100"></div><label class="field-label" for="signature-canvas">Firma manuscrita</label><canvas id="signature-canvas" class="signature" aria-label="Área para dibujar firma manuscrita" tabindex="0"></canvas><div class="actions">${button('Borrar y repetir','clear-signature','','small')}<span class="signature-help">Dibuja con el dedo, lápiz o ratón.</span></div><p class="small muted" style="margin-top:18px;line-height:1.6">La firma se vinculará al hash ${esc(report.content_hash?.slice(0,18))}… y no podrá cambiarse después del cierre.</p>`,'Confirmar firma',async fd=>{if(!m.signatureDrawn)throw new Error('Dibuja la firma antes de confirmar.');await adminMutation('/signatures',{report_id:report.id,role:fd.get('role'),name:String(fd.get('name')).trim(),image:$('#signature-canvas',m).toDataURL('image/png'),content_hash:report.content_hash},'Firma vinculada al reporte.');m.close();});const canvas=$('#signature-canvas',m);const rect=canvas.getBoundingClientRect();canvas.width=Math.round(rect.width*2);canvas.height=420;const context=canvas.getContext('2d');context.fillStyle='#ffffff';context.fillRect(0,0,canvas.width,canvas.height);context.strokeStyle='#112c42';context.lineWidth=4;context.lineCap='round';context.lineJoin='round';let drawing=false,last=null,travel=0;const position=e=>{const box=canvas.getBoundingClientRect();return {x:(e.clientX-box.left)*canvas.width/box.width,y:(e.clientY-box.top)*canvas.height/box.height}};canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=position(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=position(e);travel+=Math.hypot(p.x-last.x,p.y-last.y);context.beginPath();context.moveTo(last.x,last.y);context.lineTo(p.x,p.y);context.stroke();last=p;m.signatureDrawn=travel>35});const end=()=>drawing=false;canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);m.clearSignature=()=>{context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);travel=0;m.signatureDrawn=false};}
async function downloadReport(id,format){requireOnline();if(cloud)await cloudRefresh();const endpoint=cloud?`${cloud.url}/functions/v1/${cloud.functionName}/api/reports/${encodeURIComponent(id)}/${format}`:'/api/reports/'+encodeURIComponent(id)+'/'+format;const headers={};if(cloud)headers.apikey=cloud.publishableKey;if(state.session?.token)headers.Authorization='Bearer '+state.session.token;const response=await fetch(endpoint,{headers});if(!response.ok){let e;try{e=await response.json()}catch{e={error:'No se pudo descargar el reporte.'}}throw new Error(e.error)}const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`inventario-${state.warehouse}-${id}.${format==='new-pdf'?'pdf':format}`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}

 elevate:()=>dialog('Acceso administrativo','<div class="field"><label for="admin-password">Contraseña administrativa compartida</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required></div>','Acceder',async fd=>{requireOnline();const result=await api('/admin',{password:fd.get('password')});if(result.token)state.session.token=result.token;if(result.user)state.session.user=result.user;await refresh(true);$('#modal').close();state.page='admin';render();toast('Acceso administrativo habilitado.')}),
 'new-period':()=>{const now=new Date();dialog('Preparar inventario mensual',`<div class="row"><div class="field"><label for="period-month">Mes</label><select id="period-month" name="month">${months.map((m,i)=>`<option value="${i+1}" ${i===now.getMonth()?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label for="period-year">Año</label><input type="number" id="period-year" name="year" value="${now.getFullYear()}" min="2000" max="2200" required></div></div>`,'Crear período',async fd=>{const r=await adminMutation('/periods',{month:Number(fd.get('month')),year:Number(fd.get('year'))},'Período creado.');state.period=r.id;state.warehouse=null;state.page='warehouses';$('#modal').close();render()})},
 'new-warehouse':()=>{if(!state.period)throw new Error('Selecciona un período.');dialog('Agregar bodega','<div class="field"><label for="warehouse-code">Código de bodega</label><input id="warehouse-code" name="code" required maxlength="30"></div><div class="field"><label for="warehouse-name">Nombre</label><input id="warehouse-name" name="name" required maxlength="150"></div><p class="small muted">El catálogo se incorpora mediante importación XLS.</p>','Agregar',async fd=>{await adminMutation('/warehouse',{period_id:state.period,code:String(fd.get('code')).trim(),name:String(fd.get('name')).trim()},'Bodega agregada.');$('#modal').close()})},
 import:()=>importDialog(),
 'change-password':()=>dialog('Cambiar contraseña administrativa','<div class="field"><label for="old-password">Contraseña actual</label><input id="old-password" type="password" name="old_password" autocomplete="current-password" required></div><div class="field"><label for="new-password">Nueva contraseña</label><input id="new-password" type="password" name="new_password" autocomplete="new-password" minlength="12" required><span class="help">Mínimo 12 caracteres.</span></div>','Cambiar contraseña',async fd=>{await adminMutation('/password',{old_password:fd.get('old_password'),new_password:fd.get('new_password')},'Contraseña actualizada.');$('#modal').close()}),
 finish:async()=>{requireOnline();dialog('Confirmar fin del dispositivo',`<p class="section-caption">Confirme que terminó de contar en todas las pestañas de este dispositivo. Se enviarán los registros pendientes antes de confirmar el fin de la bodega ${esc(state.warehouse)}.</p>`,'Terminé y envié todo',async()=>{const lock=`finish-lock:${state.session.user.id}:${key()}`;let confirmed=false,attempted=false,certainFailure=false;state.finishing=true;await put(lock,true);try{await sync();await loadQueue();if(scopePending().length)throw new Error('Aún hay operaciones pendientes o conflictos para esta bodega.');attempted=true;await api('/device/finish',{period_id:state.period,warehouse:state.warehouse,pending:0});confirmed=true;delete state.joined[key()];await put('joined:'+state.session.user.id,state.joined);await refresh(true);$('#modal').close();render();toast('Dispositivo confirmado como terminado.');}catch(e){certainFailure=[400,401,403,404,409,422].includes(e.status);if(attempted&&!certainFailure){delete state.joined[key()];await put('joined:'+state.session.user.id,state.joined);e.message+=' El fin podría haberse registrado. Se conserva el bloqueo; reanude con conexión antes de contar.';}throw e;}finally{state.finishing=!confirmed&&attempted&&!certainFailure;if(!confirmed&&(!attempted||certainFailure))await del(lock);}});},
 retire:el=>dialog('Retirar dispositivo participante','<p class="notice amber">El dispositivo puede conservar conteos offline que todavía no envió. Recupera sus registros antes de retirarlo. La renuncia quedará auditada.</p><div class="field"><label for="retire-reason">Motivo y comprobación realizada</label><textarea id="retire-reason" name="reason" required minlength="12"></textarea></div>','Confirmar retiro',async fd=>{await adminMutation('/device/retire',{period_id:state.period,warehouse:state.warehouse,session_id:el.dataset.session,reason:fd.get('reason')},'Participante retirado con constancia.');$('#modal').close()}),
 'new-report':()=>dialog('Generar reporte',`<p class="section-caption">${esc(periodName())} · ${esc(currentWarehouse().name)}. Cada generación conserva una nueva versión del resultado.</p><div class="field"><label for="report-kind">Tipo de reporte</label><select id="report-kind" name="kind"><option value="provisional">Provisional · permite continuar contando</option><option value="final">Definitivo · bloquea conteos y habilita firmas</option></select></div><p class="small muted">El reporte definitivo exige resolver los faltantes, confirmar todos los dispositivos y resolver los conflictos.</p>`,'Generar versión',async fd=>{if(scopePending().length)throw new Error('Sincroniza los registros de esta bodega antes de generar el reporte.');await adminMutation('/reports',{period_id:state.period,warehouse:state.warehouse,kind:fd.get('kind'),uncounted_reason:''},'Nueva versión del reporte generada.');$('#modal').close();render()}),
 download:el=>downloadReport(el.dataset.id,el.dataset.format),
 sign:el=>signatureDialog(el.dataset.id),
 'clear-signature':()=>$('#modal').clearSignature?.(),
 'close-warehouse':el=>dialog('Cerrar bodega definitivamente',`<p class="section-caption">La bodega ${esc(state.warehouse)} quedará bloqueada para nuevos conteos y correcciones. El servidor verificará ambas firmas, los participantes y la integridad de este reporte.</p>`,'Cerrar bodega',async()=>{if(scopePending().length)throw new Error('Hay operaciones pendientes en este dispositivo.');await adminMutation('/warehouse/close',{report_id:el.dataset.id},'Bodega cerrada. El PDF definitivo queda conservado.');$('#modal').close();render()}),
 'close-month':()=>{if(!state.period)throw new Error('Selecciona un período.');dialog('Cerrar inventario mensual',`<p class="section-caption">${esc(periodName())}. El cierre congela el período completo. Todas las bodegas, firmas, reportes y participantes deben estar confirmados en el servidor.</p>`,'Cerrar inventario',async()=>{if(pending().some(o=>String(o.period_id)===String(state.period)))throw new Error('Hay operaciones de este período pendientes en el dispositivo.');await adminMutation('/period/close',{period_id:state.period},'Inventario mensual cerrado y disponible en el historial.');$('#modal').close();render()})},
 reopen:el=>dialog('Reabrir conteos de la bodega','<p class="notice amber">Se invalidarán las firmas de esta versión definitiva. Los nuevos resultados necesitarán un reporte nuevo y dos firmas nuevas.</p><div class="field"><label for="reopen-reason">Motivo de reapertura</label><textarea id="reopen-reason" name="reason" required minlength="5"></textarea></div>','Reabrir conteo',async fd=>{await adminMutation('/reports/reopen',{report_id:el.dataset.id,reason:fd.get('reason')},'Conteo reabierto.');$('#modal').close();render()}),
 'resolve-recount':el=>dialog('Decidir recuento completo','<p class="notice amber">Aceptar el recuento reemplaza explícitamente el resultado anterior de este artículo y presentación. No se suma como otro parcial. La decisión queda auditada.</p><div class="field"><label for="recount-action">Decisión</label><select id="recount-action" name="action"><option value="reject">Rechazar recuento y mantener parciales vigentes</option><option value="accept">Aceptar recuento como resultado completo</option></select></div><div class="field"><label for="recount-reason">Motivo</label><textarea id="recount-reason" name="reason" required minlength="5"></textarea></div>','Confirmar decisión',async fd=>{await adminMutation('/recount/resolve',{record_id:el.dataset.id,action:fd.get('action'),reason:fd.get('reason')},'Recuento resuelto.');$('#modal').close();await navigate('consolidation')}),
 install:async()=>{if(state.install){await state.install.prompt();await state.install.userChoice;state.install=null;render()}else toast('Android / Windows: menú del navegador → Instalar aplicación. iPad: Safari → Compartir → Añadir a pantalla de inicio.')}
};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(!fn)return;try{await fn(el)}catch(error){toast(error.message,true)}});
document.addEventListener('input',e=>{if(e.target.id==='record-search'){const q=e.target.value.toLocaleLowerCase();$('#record-results').innerHTML=recordsHTML(effectiveRecords().filter(r=>[r.name,r.code,r.owner_name,r.zone].join(' ').toLocaleLowerCase().includes(q)))}});
 document.addEventListener('submit',async e=>{if(e.target.id==='count-form'){e.preventDefault();const b=$('button[type=submit]',e.target);b.disabled=true;try{await saveCount(new FormData(e.target))}catch(error){toast(error.message,true)}finally{if(b.isConnected)b.disabled=!canCount()}}if(e.target.id==='login-form'){e.preventDefault();const b=$('button[type=submit]',e.target);b.disabled=true;try{const fd=new FormData(e.target);const role=String(fd.get('role')||'counter');let deviceId=await get('device_id');if(!deviceId){deviceId=uid();await put('device_id',deviceId)}if(cloud)state.cloudAuth=await cloudIdentity();const result=await api('/login',{name:String(fd.get('name')).trim(),device_id:deviceId,role,password:role==='admin'?fd.get('password')||undefined:undefined});if(cloud){result.cloudAuth=state.cloudAuth;await put('cloud_auth',state.cloudAuth);state.cloudAuth=null}await del('owner_activation_name');state.session=result;state.session.expired=false;await put('session',state.session);await restoreSession();await refresh(true);render();if(state.online)sync().catch(()=>{})}catch(error){state.cloudAuth=null;toast(error.message,true)}finally{if(b.isConnected)b.disabled=false}}});
async function restoreSession(){state.data=await get('snapshot:'+state.session.user.id)||{user:state.session.user,periods:[],warehouses:[],imports:[],config:{}};state.joined=await get('joined:'+state.session.user.id)||{};const selected=await get('selection');state.period=selected?.period||null;state.warehouse=selected?.warehouse||null;state.lastSync=await get('lastSync');await loadQueue();if(state.period&&state.warehouse){state.finishing=!!await get(`finish-lock:${state.session.user.id}:${key()}`);state.catalog=await cachedCatalog();await loadRecords();mergePendingArticles()}state.page=state.period?'warehouses':'periods';}
window.addEventListener('online',async()=>{state.online=true;render();if(state.session){const refreshed=await refresh(true);if(refreshed&&state.period&&state.warehouse&&!isClosed()){try{await ensureParticipation()}catch{}}await sync(false,true).catch(()=>{});render()}});
window.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&navigator.onLine&&state.session){state.online=true;const refreshed=await refresh(true);if(refreshed&&state.period&&state.warehouse&&!isClosed()){try{await ensureParticipation()}catch{}}await sync(false,true).catch(()=>{});render()}});
window.addEventListener('offline',()=>{state.online=false;render();toast('Sin conexión. Puedes seguir contando con el catálogo descargado.')});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.install=e;if(state.session)render()});

async function consumeAuthRedirect(){if(!cloud)return false;const params=new URLSearchParams(location.hash.replace(/^#/,'') );const access=params.get('access_token'),refresh=params.get('refresh_token');if(!access||!refresh)return false;const auth={access_token:access,refresh_token:refresh,expires_at:Math.floor(Date.now()/1000)+Number(params.get('expires_in')||3600)};await put('cloud_auth',auth);state.cloudAuth=auth;history.replaceState(null,'',location.pathname+location.search);return true}
async function boot(){const offlineReady=prepareOfflineShell().catch(()=>false);try{await openDB();const ownerCallback=await consumeAuthRedirect();await migrateOperationSequence();await migrateCatalogPrivacy();await loadQueue();state.session=await get('session');state.cloudAuth=await get('cloud_auth');if(ownerCallback){await del('session');state.session=null}state.offlineReady=await offlineReady;if(state.session){await restoreSession();render();if(state.online){await refresh(true);render();sync(false,true).catch(()=>{})}}else render();if(!state.offlineReady)toast('La caché offline no quedó lista. No empieces a contar hasta volver a cargar con conexión.',true);if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});refreshTimer=setInterval(async()=>{if(!state.session||!navigator.onLine||polling||document.hidden)return;polling=true;try{await refresh(true);await sync();if(!['count','records'].includes(state.page)&&!$('#modal').open)render()}catch{}finally{polling=false}},15000)}catch(error){$('#app').innerHTML=`<div class="boot"><h1>No se pudo abrir el almacenamiento</h1><p style="max-width:550px;text-align:center;line-height:1.6">${esc(error.message)}. Permite el almacenamiento del navegador y utiliza una ventana normal. No se pueden guardar conteos de forma segura sin IndexedDB.</p><button class="button primary" data-action="reload">Volver a intentar</button></div>`}}
boot();

</script></head><body><div id="app"><div class="boot"><span class="brand-mark">i</span><h1>Inventario físico</h1><p>Cargando tu espacio de trabajo…</p></div></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><noscript>Activa JavaScript para utilizar el inventario.</noscript></body></html>
