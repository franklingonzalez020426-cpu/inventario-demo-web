.login-wave {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: visible;
  pointer-events: none;
}

.login-wave-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 200%;
  height: 100%;
  animation: mari-wave-flow 7s linear infinite;
}

.login-wave-front { color: #006D46; }
.login-wave-back {
  top: 4%;
  color: #28845F;
  animation-duration: 11s;
  animation-delay: -4s;
}

@keyframes mari-wave-flow {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

.login-photo-placeholder{position:relative;overflow:hidden;min-height:0;padding:0;background:#e5e9e2;isolation:isolate}
.login-photo{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center 52%}
@media(max-width:1000px){.login-photo-placeholder{min-height:0;padding:0}}

/* The photo runs beneath the curved edge; the green wave remains the top layer. */
.login-hero-green{z-index:1}
.login-photo-placeholder{z-index:0;margin-top:-32px}
@media(max-width:420px){.login-photo-placeholder{margin-top:-30px}}

/* Tablet fit: keep all branding inside the green panel and tuck the image farther beneath it. */
@media(max-width:1000px){.login-hero{height:410px;grid-template-rows:190px minmax(0,1fr)}.login-hero-green{padding-top:20px;padding-bottom:48px}.login-photo-placeholder{margin-top:-44px}.login-photo{transform:scale(1.08);object-position:center 55%}}

/* Keep the photo behind the green arc so no blank strip appears on narrow screens. */
.login-hero{position:relative}
.login-hero-green{z-index:2}
.login-photo-placeholder{position:absolute;inset:30% 0 0;z-index:1;margin:0!important;min-height:0;padding:0}

    align-self: start;
    max-height: max(230px, 48vh);
    max-height: max(230px, 48dvh);
    grid-template-rows: var(--login-brand-height) minmax(0, 1fr);

  .login-main {

/* First paint while the application opens its local workspace. */
.mari-splash {
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  padding: 24px;
  background: #006D46;
  color: #fff;
  color-scheme: light;
}
.mari-splash::before {
  content: "";
  position: absolute;
  inset: 72% -24% -30%;
  z-index: -1;
  border-radius: 50% 50% 0 0 / 25% 25% 0 0;
  background: #005B3A;
  transform: rotate(-6deg);
}
.mari-splash__content {
  display: grid;
  justify-items: center;
  gap: 16px;
  width: min(100%, 230px);
}
.mari-splash__plate {
  display: grid;
  place-items: center;
  width: 100%;
  padding: 20px 27px;
  border-radius: 20px;
  background: #F5F5F0;
  box-shadow: 0 12px 32px #003B2B44;
}
.mari-splash__plate img {
  display: block;
  width: 100%;
  height: auto;
}
.mari-splash__message {
  margin: 3px 0 0;
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
}
.mari-splash__track {
  width: 104px;
  height: 4px;
  overflow: hidden;
  border-radius: 99px;
  background: #ffffff38;
}
.mari-splash__track::before {
  content: "";
  display: block;
  width: 42%;
  height: 100%;
  border-radius: inherit;
  background: #D9F3EB;
  animation: mari-splash-sweep 1.35s ease-in-out infinite;
}
@keyframes mari-splash-sweep {
  from { transform: translateX(-100%); }
  to { transform: translateX(240%); }
}
@media (prefers-reduced-motion: reduce) {
  .mari-splash__track::before {
    animation: none;
    transform: translateX(70%);
  }
}

.shell .sidebar {
  background: #006346;
}
.sidebar .mari-app-brand {
  gap: 13px;
  padding: 0 4px;
}
.mari-app-brand__plate {
  display: grid;
  place-items: center;
  flex: 0 0 77px;
  padding: 7px 9px;
  border-radius: 11px;
  background: #F5F5F0;
}
.mari-app-brand__plate img,
.mari-app-mobile img {
  display: block;
  width: 100%;
  height: auto;
}
.mari-app-brand__caption {
  color: #fff;
  font-size: .83rem;
  font-weight: 650;
  line-height: 1.3;
  letter-spacing: 0;
}
.mari-app-mobile {
  width: 46px;
  flex: 0 0 46px;
}
.sidebar .nav button {
  color: #E4F2E9;
}
.sidebar .nav button.active {
  color: #fff;
  background: #ffffff24;
  box-shadow: inset 3px 0 0 #BDE6D0;
}
.sidebar .nav .mari-icon {
  flex: 0 0 auto;
}
.mari-icon {
  display: block;
  width: 20px;
  height: 20px;
}
.mari-breadcrumb-root {
  font-weight: 700;
  color: #005A3E;
}
.mari-breadcrumb-divider {
  margin-inline: 10px;
  color: #788C81;
}
.mari-periods {
  max-width: 1240px;
  margin-inline: auto;
}
.mari-periods .page-head {
  align-items: center;
  margin-bottom: 27px;
}
.mari-periods .page-head .eyebrow {
  color: #006346;
  margin-bottom: 8px;
  letter-spacing: .11em;
}
.mari-periods h1,
.mari-periods h2,
.mari-periods .stat .value {
  font-family: "Mari Panel Display", "Segoe UI", sans-serif;
  font-weight: 760;
}
.mari-periods .page-head h1 {
  color: #233C31;
  font-size: clamp(1.9rem, 3.3vw, 2.8rem);
  line-height: 1.08;
  letter-spacing: -.045em;
}
.mari-periods .page-head p {
  max-width: 72ch;
}
.mari-periods .stats {
  gap: 14px;
  margin-bottom: 28px;
}
.mari-periods .stat {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 13px;
  padding: 17px 18px;
  background: #FCFDFA;
  border-color: #D9E4DB;
  border-radius: 12px;
}
.mari-periods__icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  color: #006346;
  background: #E5F1E8;
  border-radius: 9px;
}
.mari-periods .stat .label {
  color: #4F6358;
  font-size: .8rem;
  line-height: 1.3;
  overflow-wrap: anywhere;
}
.mari-periods .stat .value {
  margin-top: 2px;
  color: #233C31;
  font-size: 1.75rem;
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
}
.mari-periods__list-heading {
  margin: 0 0 12px;
  color: #233C31;
  font-size: 1.24rem;
}
.mari-periods .period-card {
  gap: 14px 20px;
  padding: 18px 20px;
  border-color: #D9E4DB;
  border-radius: 12px;
}
.mari-periods__period {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.mari-periods__period > .mari-periods__icon {
  flex: 0 0 40px;
}
.mari-periods__period h2 {
  margin: 0 0 4px;
  color: #233C31;
  font-size: 1.23rem;
}
.mari-periods .period-card .badge.blue {
  color: #12523C;
  background: #E2F1E8;
}
@media (max-width: 1000px) {
  .sidebar .nav button.active {
    box-shadow: inset 0 -2px 0 #BDE6D0;
  }
  .sidebar .nav .mari-icon {
    width: 18px;
    height: 18px;
  }
  .mari-periods .page-head {
    align-items: flex-start;
  }
  .mari-periods .page-head .actions {
    width: auto;
  }
}
@media (max-width: 650px) {
  .mari-periods {
    padding-inline: 4px;
  }
  .mari-periods .page-head {
    margin-bottom: 19px;
    gap: 14px;
  }
  .mari-periods .stats {
    gap: 7px;
    margin-bottom: 23px;
  }
  .mari-periods .stat {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    align-items: start;
    gap: 8px;
    padding: 10px 8px;
  }
  .mari-periods .stat .label {
    min-height: 2.6em;
    font-size: .69rem;
  }
  .mari-periods .stat .value {
    font-size: 1.45rem;
  }
  .mari-periods .stat .mari-periods__icon {
    width: 29px;
    height: 29px;
  }
  .mari-periods .stat .mari-icon {
    width: 17px;
    height: 17px;
  }
  .mari-periods .period-card {
    padding: 14px 12px;
  }
  .mari-periods .period-card .actions {
    width: 100%;
    justify-content: space-between;
  }
}
@media (max-width: 359px) {
  .sidebar .nav {
    gap: 1px;
  }
  .sidebar .nav button {
    padding-inline: 2px;
  }
}

/* Batch confirmation in the missing-items review. */
.bulk-zero-list {
  max-height: min(33vh, 280px);
  margin: 0 0 18px;
  padding: 0 14px;
  overflow: auto;
  list-style: none;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.bulk-zero-list li {
  display: grid;
  gap: 2px;
  padding: 9px 0;
  overflow-wrap: anywhere;
  font-size: .83rem;
}
.bulk-zero-list li + li {
  border-top: 1px solid var(--line);
}
.bulk-zero-list small {
  color: var(--muted);
}
.missing-bulk-action {
  margin-bottom: 16px;
}

.queue-issues { margin-bottom: 1rem; }
.queue-issues .list-detail > div { min-width: 0; overflow-wrap: anywhere; }
.participant-actions { margin: 0 0 1rem; }
.participant-group { border-top: 1px solid var(--line); padding: .65rem 0; }
.participant-group summary { display: flex; align-items: center; justify-content: space-between; gap: .65rem; cursor: pointer; }
.participant-group .list-detail { font-size: .78rem; gap: .75rem; }
.participant-footer { margin: .9rem 0 0; }
.participant-picker { max-height: 42vh; overflow: auto; margin: .8rem 0; }
.participant-picker-group { border: 1px solid var(--line); border-radius: .5rem; margin: .5rem 0; padding: .5rem .7rem; }
.participant-picker-group label { margin: .35rem 0; align-items: flex-start; }
.participant-picker-group small { display: block; color: var(--muted); }
.sync-attention { color: var(--red); white-space: nowrap; }
@media(max-width:460px) {
  .top-status:has(.sync-attention) > .status { display: none; }
  .top-status .sync-attention { padding-inline: .25rem; }
}

  const warehouse=esc(currentWarehouse()?.name||scope.warehouse);
  const rows=listed.map(row=>`<li><strong>${esc(row.name)}</strong><small>${esc(row.code)} · ${esc(row.presentation)}</small></li>`).join('');
  const modal=dialog('Confirmar faltantes en cero',`

}

const backupEnvironment = () => cloud ? `${cloud.url}/${cloud.functionName}` : location.origin;
async function backupDigest(data){
  const hash = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(data));

  const data = JSON.stringify({environment:backupEnvironment(),owner:user.id,username:user.username||null,device:user.device_id,
    created:new Date().toISOString(),entries:rows.map(op=>({operation:wireOperation(op),sequence:op.sequence,
      created:op.created,status:op.status,error_code:op.error_code,error:op.error}))});

  if(blob.size>25_000_000)throw new Error('El respaldo supera 25 MB. Sincronice los envíos disponibles y vuelva a intentarlo.');
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href=url; link.download=`Mari-respaldo-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
  document.body.append(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),30000);

async function readPendingBackup(file){
  if(!file?.size||file.size>25_000_000)throw new Error('Seleccione un respaldo de Mari de hasta 25 MB.');
  let envelope;
  try{envelope=JSON.parse(await file.text());}catch{throw new Error('El archivo no es un respaldo válido de Mari.');}
  if(envelope?.format!==backupFormat||typeof envelope.data!=='string'||await backupDigest(envelope.data)!==envelope.sha256){
    throw new Error('El respaldo está dañado o fue modificado. Use el archivo original.');
  }
  const data=JSON.parse(envelope.data);
  if(!data||data.environment!==backupEnvironment()||typeof data.owner!=='string'||typeof data.device!=='string'||!Array.isArray(data.entries)||!data.entries.length){
    throw new Error('El archivo no corresponde a esta instalación de Mari.');
  }
  const ids=new Set();
  for(const entry of data.entries){
    const op=entry?.operation;
    if(!op||!['count','correct','new_article','recount'].includes(op.kind)||
      !['id','record_id','period_id','warehouse','code','presentation'].every(field=>typeof op[field]==='string'&&op[field].trim())||
      !Number.isSafeInteger(op.revision)||op.revision<0||typeof op.quantity!=='string'||!/^\d{1,12}(?:\.\d{1,6})?$/.test(op.quantity)||
      ids.has(op.id)||Object.keys(op).some(field=>!Object.hasOwn(wireOperation(op),field))){
      throw new Error('El respaldo contiene un envío inválido o repetido.');
    }
    ids.add(op.id);
  }

}
async function restoreBackupQueue(data,receipts,user){
  if(state.session?.user.id!==user.id)throw new Error('La cuenta cambió. Abra el respaldo de nuevo.');
  const entries=data.entries.filter(entry=>!receipts.has(entry.operation.id)).sort((a,b)=>operationOrder({...a,id:a.operation.id},{...b,id:b.operation.id}));
  let inserted=0;
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(['kv','operations'],'readwrite'), store=tx.objectStore('operations'), kv=tx.objectStore('kv');
    let problem;
    tx.oncomplete=resolve;tx.onabort=()=>reject(problem||tx.error||new Error('No se pudo restaurar el respaldo.'));
    const existing=store.getAll();
    existing.onsuccess=()=>{
      const stored=existing.result;
      const byId=new Map(stored.map(op=>[op.id,op]));
      for(const {operation} of entries){
        const local=byId.get(operation.id);
        if(local&&(local.owner_id!==user.id||JSON.stringify(wireOperation(local))!==JSON.stringify(wireOperation(operation)))){
          problem=new Error('Un envío del respaldo tiene el mismo identificador que un envío local con datos distintos.');tx.abort();return;
        }
      }
      const occupied=new Set(stored.filter(op=>!op.resolved&&op.owner_id===user.id).map(op=>op.record_id));
      const conflicts=new Set(entries.filter(({operation})=>!byId.has(operation.id)&&occupied.has(operation.record_id)).map(({operation})=>operation.record_id));
      if(conflicts.size){problem=new Error('Hay envíos locales distintos para los mismos registros. Descargue un respaldo de esos envíos y revíselos antes de combinar las copias.');tx.abort();return;}
      const counter=kv.get('operationSequence');
      counter.onsuccess=()=>{
        let sequence=Number(counter.result)||0;
        for(const entry of entries){
          if(byId.has(entry.operation.id))continue;
          if(!Number.isSafeInteger(++sequence)){tx.abort();return;}
          const blocked=['error','conflict'].includes(entry.status);
          store.add({...entry.operation,sequence,created:typeof entry.created==='string'?entry.created:data.created,
            owner_id:user.id,owner_name:user.name,device_id:user.device_id,status:blocked?entry.status:'pending',recovery_hold:true,
            error_code:blocked?entry.error_code:undefined,error:blocked?entry.error:undefined});
          inserted++;
        }
        kv.put(sequence,'operationSequence');
      };
    };
  });
  return inserted;
}

      if(state.session?.user.id!==current.id)throw new Error('La cuenta cambió. Abra el respaldo de nuevo.');

        if((await all('operations')).some(op=>!op.resolved&&op.owner_id===current.id))throw new Error('Esta sesión tiene envíos pendientes. Descargue un respaldo y revíselos antes de cambiar a la sesión original.');
        if(!form.get('secret'))throw new Error('Escriba la contraseña de la cuenta para recuperar la sesión original.');

        await restoreSession();
        await refresh(true);
      }
      const user=state.session.user;
      const receipts=new Set();
      for(let index=0;index<data.entries.length;index+=50){
        const batch=data.entries.slice(index,index+50).map(entry=>entry.operation);
        const result=await api('/recovery/receipts',{operations:batch});

      await loadQueue();
      modal.close();

    });

function getDeviceId(){
  return new Promise((resolve,reject)=>{
    const transaction=db.transaction('kv','readwrite'),store=transaction.objectStore('kv');
    let device;
    transaction.oncomplete=()=>resolve(device);
    transaction.onerror=()=>reject(transaction.error);
    transaction.onabort=()=>reject(transaction.error);
    const request=store.get('device_id');
    request.onsuccess=()=>{
      device=request.result||uid();
      if(!request.result)store.put(device,'device_id');
    };
  });
}
async function saveNamedSession(result){

function stageReviewedCorrection(op,corrections,revision,reason,user){

async function unsavedDraftCount(scope){
  const prefix=draftPrefix(scope);
  const range=IDBKeyRange.bound(prefix,prefix+'\uffff');
  const drafts=await idbRequest(db.transaction('kv').objectStore('kv').getAll(range));
  return drafts.filter(draft=>String(draft?.value??'').trim()).length;
}
function saveSheetDraft(scope,item,value){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('kv','readwrite'),store=tx.objectStore('kv');
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error||new Error('Este dispositivo ya terminó. Reanude antes de editar.'));
    const check=store.get(finishKey(scope));
    check.onsuccess=()=>{
      if(check.result){tx.abort();return;}
      store.put({value},draftPrefix(scope)+item);
    };
  });
}
function acquireFinishLock(scope){
  return new Promise((resolve,reject)=>{
    const transaction=db.transaction('kv','readwrite'),store=transaction.objectStore('kv');
    const lock=finishKey(scope);
    let alreadyFinished=false;
    transaction.oncomplete=resolve;
    transaction.onerror=()=>reject(transaction.error);
    transaction.onabort=()=>reject(alreadyFinished
      ?new Error('Este dispositivo ya confirmó el fin. Si necesita contar de nuevo, use Reanudar en la hoja.')
      :transaction.error||new Error('No se pudo iniciar la confirmación de fin.'));
    const request=store.get(lock);
    request.onsuccess=()=>{
      if(request.result){alreadyFinished=true;transaction.abort();return;}
      store.put(true,lock);
    };
  });
}
function finishDevice(){
  requireOnline();
  const scope=warehouseScope();
  if(!scope.period||!scope.warehouse||scopeReadOnly(scope))throw new Error('Esta bodega ya no está disponible para contar.');
  dialog('Confirmar fin del dispositivo',`<p class="section-caption">Guarda o borra las cantidades que sigan como borrador en todas las pestañas. Mari enviará los registros pendientes antes de confirmar el fin de la bodega ${esc(scope.warehouse)}.</p>`,'Terminé y envié todo',async()=>{
    if(!sameWarehouseScope(scope))throw new Error('Vuelva a abrir la bodega para confirmar el fin.');
    requireOnline();
    const lock=finishKey(scope);
    await acquireFinishLock(scope);
    if(sameWarehouseScope(scope))state.finishing=true;
    let keepLock=false;
    try{
      const drafts=await unsavedDraftCount(scope);
      if(drafts)throw new Error(`Hay ${drafts} ${drafts===1?'cantidad sin guardar':'cantidades sin guardar'}. Vuelva a la hoja para guardarlas o borrarlas.`);
      if(syncRun)await syncRun.catch(()=>{});
      await sync(false,true);
      await loadQueue();
      if(!sameWarehouseScope(scope))throw new Error('La bodega cambió. Vuelva a abrirla para confirmar el fin.');
      if(scopePending(scope.period,scope.warehouse).length)throw new Error('Aún hay operaciones pendientes o conflictos para esta bodega.');
      try{
        await api('/device/finish',{period_id:scope.period,warehouse:scope.warehouse,pending:0});
        keepLock=true;
      }catch(error){
        keepLock=![400,401,403,404,409,422].includes(error.status);
        if(keepLock)error.message+=' El servidor pudo haber confirmado el fin. Revise el estado antes de reanudar.';
        throw error;
      }
      if(state.session?.user.id===scope.owner){
        delete state.joined[key(scope.period,scope.warehouse)];
        await put('joined:'+scope.owner,state.joined);
        await refresh(true);
      }
      if($('#modal').open)$('#modal').close();
      render();
      toast('Dispositivo confirmado como terminado.');
    }finally{
      if(!keepLock)await del(lock);
      if(sameWarehouseScope(scope))state.finishing=keepLock;
    }
  });
}

 'new-period':()=>{const now=new Date();dialog('Preparar inventario mensual',`<div class="row"><div class="field"><label for="period-month">Mes</label><select id="period-month" name="month">${months.map((m,i)=>`<option value="${i+1}" ${i===now.getMonth()?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label for="period-year">Año</label><input type="number" id="period-year" name="year" value="${now.getFullYear()}" min="2000" max="2200" required></div></div>`,'Crear período',async fd=>{const r=await adminMutation('/periods',{month:Number(fd.get('month')),year:Number(fd.get('year'))},'Período creado.');setWarehouseScope(r.id,null);state.page='warehouses';$('#modal').close();render()})},
 'new-warehouse':()=>{if(!state.period)throw new Error('Selecciona un período.');dialog('Agregar bodega','<div class="field"><label for="warehouse-code">Código de bodega</label><input id="warehouse-code" name="code" required maxlength="30"></div><div class="field"><label for="warehouse-name">Nombre</label><input id="warehouse-name" name="name" required maxlength="150"></div><p class="small muted">El catálogo se incorpora mediante importación XLS.</p>','Agregar',async fd=>{await adminMutation('/warehouse',{period_id:state.period,code:String(fd.get('code')).trim(),name:String(fd.get('name')).trim()},'Bodega agregada.');$('#modal').close()})},
 import:()=>importDialog(),
 'change-password':()=>dialog('Cambiar contraseña administrativa','<div class="field"><label for="old-password">Contraseña actual</label><input id="old-password" type="password" name="old_password" autocomplete="current-password" required></div><div class="field"><label for="new-password">Nueva contraseña</label><input id="new-password" type="password" name="new_password" autocomplete="new-password" minlength="12" required><span class="help">Mínimo 12 caracteres.</span></div>','Cambiar contraseña',async fd=>{await adminMutation('/password',{old_password:fd.get('old_password'),new_password:fd.get('new_password')},'Contraseña actualizada.');$('#modal').close()}),
 finish:()=>finishDevice(),
 'review-participants':()=>reviewParticipants(),
 'new-report':()=>reportDialog('provisional'),
 'request-signatures':()=>reportDialog('final'),
 download:el=>downloadReport(el.dataset.id,el.dataset.format),
 sign:el=>signatureDialog(el.dataset.id),
 'clear-signature':()=>$('#modal').clearSignature?.(),
 'close-warehouse':el=>dialog('Cerrar bodega definitivamente',`<p class="section-caption">La bodega ${esc(state.warehouse)} quedará bloqueada para nuevos conteos y correcciones. El servidor verificará ambas firmas, los participantes y la integridad de este reporte.</p>`,'Cerrar bodega',async()=>{if(scopePending().length)throw new Error('Hay operaciones pendientes en este dispositivo.');await adminMutation('/warehouse/close',{report_id:el.dataset.id},'Bodega cerrada. El PDF definitivo queda conservado.');$('#modal').close();render()}),
 'close-month':()=>{if(!state.period)throw new Error('Selecciona un período.');dialog('Cerrar inventario mensual',`<p class="section-caption">${esc(periodName())}. El cierre congela el período completo. Todas las bodegas, firmas, reportes y participantes deben estar confirmados en el servidor.</p>`,'Cerrar inventario',async()=>{if(pending().some(o=>String(o.period_id)===String(state.period)))throw new Error('Hay operaciones de este período pendientes en el dispositivo.');await adminMutation('/period/close',{period_id:state.period},'Inventario mensual cerrado y disponible en el historial.');$('#modal').close();render()})},
 reopen:el=>dialog('Reabrir conteos de la bodega','<p class="notice amber">Se invalidarán las firmas de esta versión definitiva. Los nuevos resultados necesitarán un reporte nuevo y dos firmas nuevas.</p><div class="field"><label for="reopen-reason">Motivo de reapertura</label><textarea id="reopen-reason" name="reason" required minlength="5"></textarea></div>','Reabrir conteo',async fd=>{await adminMutation('/reports/reopen',{report_id:el.dataset.id,reason:fd.get('reason')},'Conteo reabierto.');$('#modal').close();render()}),
 'resolve-recount':el=>dialog('Decidir recuento completo','<p class="notice amber">Aceptar el recuento reemplaza explícitamente el resultado anterior de este artículo y presentación. No se suma como otro parcial. La decisión queda auditada.</p><div class="field"><label for="recount-action">Decisión</label><select id="recount-action" name="action"><option value="reject">Rechazar recuento y mantener parciales vigentes</option><option value="accept">Aceptar recuento como resultado completo</option></select></div><div class="field"><label for="recount-reason">Motivo</label><textarea id="recount-reason" name="reason" required minlength="5"></textarea></div>','Confirmar decisión',async fd=>{await adminMutation('/recount/resolve',{record_id:el.dataset.id,action:fd.get('action'),reason:fd.get('reason')},'Recuento resuelto.');$('#modal').close();await navigate('consolidation')}),
 install:async()=>{if(state.install){await state.install.prompt();await state.install.userChoice;state.install=null;render()}else toast('Android / Windows: menú del navegador → Instalar aplicación. iPad: Safari → Compartir → Añadir a pantalla de inicio.')}
};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(!fn)return;try{await fn(el)}catch(error){toast(error.message,true)}});
document.addEventListener('input',e=>{if(e.target.id==='record-search'){const q=e.target.value.toLocaleLowerCase();$('#record-results').innerHTML=recordsHTML(effectiveRecords().filter(r=>[r.name,r.code,r.owner_name,r.zone].join(' ').toLocaleLowerCase().includes(q)))}});
document.addEventListener('submit',async event=>{
  const form=event.target;
  if(form.id==='count-form'){
    event.preventDefault();
    const submit=$('button[type=submit]',form);
    submit.disabled=true;
    try{await saveCount(new FormData(form));}
    catch(error){toast(error.message,true);}
    finally{if(submit.isConnected)submit.disabled=!canCount();}
  }
  if(form.id!=='login-form')return;
  event.preventDefault();
  const submit=$('button[type=submit]',form);
  submit.disabled=true;
  try{
    const fields=new FormData(form);
    const device=await getDeviceId();
    if(fields.has('username')){
      const username=String(fields.get('username')).trim().toLowerCase();
      const accountDevice=await get('recovered-device:'+username)||device;
      const result=await requestApi('/account/login',{username,password:fields.get('password'),device_id:accountDevice});
      await saveNamedSession(result);
    }else{
      const role=String(fields.get('role')||'counter');
      if(cloud)state.cloudAuth=await cloudIdentity();
      const result=await api('/login',{name:String(fields.get('name')).trim(),device_id:device,role,password:role==='admin'?fields.get('password')||undefined:undefined});
      if(cloud){result.cloudAuth=state.cloudAuth;await put('cloud_auth',state.cloudAuth);state.cloudAuth=null;}
      await del('owner_activation_name');
      state.session={...result,expired:false};
      await put('session',state.session);
    }
    await restoreSession();
    await refresh(true);
    render();
    if(state.online)sync().catch(()=>{});
  }catch(error){
    state.cloudAuth=null;
    toast(error.message,true);
    if(error.code==='accounts_required')renderLogin();
  }finally{if(submit.isConnected)submit.disabled=false;}
});
async function restoreSession(){
  const owner=state.session.user.id;
  state.data=await get('snapshot:'+owner)||{user:state.session.user,periods:[],warehouses:[],imports:[],config:{}};
  state.joined=await get('joined:'+owner)||{};
  const selected=await get('selection');
  const scope=setWarehouseScope(selected?.period||null,selected?.warehouse||null);
  state.lastSync=await get('lastSync');
  await loadQueue();
  if(scope.period&&scope.warehouse)await loadScope(scope,{localOnly:true});
  if(sameWarehouseScope(scope))state.page=scope.period?'warehouses':'periods';
}
async function reconnectInventory(){
  const owner=state.session?.user.id;
  if(!owner)return;
  await refresh(true);
  if(state.session?.user.id!==owner)return;
  await reconcileCatalogVersion();
  if(state.session?.user.id!==owner)return;
  await sync(false,true).catch(()=>{});
  if(state.session?.user.id===owner&&!$('#modal').open)render();
}
window.addEventListener('online',()=>{state.online=true;if(!$('#modal').open)render();reconnectInventory().catch(()=>{});});
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.onLine&&state.session){state.online=true;reconnectInventory().catch(()=>{});}});
window.addEventListener('offline',()=>{state.online=false;render();toast('Sin conexión. Puedes seguir contando con el catálogo descargado.')});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.install=e;if(state.session)render()});

async function consumeAuthRedirect(){if(!cloud)return false;const params=new URLSearchParams(location.hash.replace(/^#/,'') );const access=params.get('access_token'),refresh=params.get('refresh_token');if(!access||!refresh)return false;const auth={access_token:access,refresh_token:refresh,expires_at:Math.floor(Date.now()/1000)+Number(params.get('expires_in')||3600)};await put('cloud_auth',auth);state.cloudAuth=auth;history.replaceState(null,'',location.pathname+location.search);return true}
async function boot(){const offlineReady=prepareOfflineShell().catch(()=>false);try{await openDB();const ownerCallback=await consumeAuthRedirect();await migrateOperationSequence();await migrateCatalogPrivacy();await loadQueue();state.session=await get('session');state.cloudAuth=await get('cloud_auth');if(ownerCallback){await del('session');state.session=null}state.offlineReady=await offlineReady;if(state.session){await restoreSession();render();if(state.online){await refresh(true);render();sync(false,true).catch(()=>{})}}else render();if(!state.offlineReady)toast('La caché offline no quedó lista. No empieces a contar hasta volver a cargar con conexión.',true);if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});refreshTimer=setInterval(async()=>{if(!state.session||!navigator.onLine||polling||document.hidden)return;polling=true;try{await refresh(true);await sync();if(!['count','records'].includes(state.page)&&!$('#modal').open)render()}catch{}finally{polling=false}},15000)}catch(error){$('#app').innerHTML=`<div class="boot"><h1>No se pudo abrir el almacenamiento</h1><p style="max-width:550px;text-align:center;line-height:1.6">${esc(error.message)}. Permite el almacenamiento del navegador y utiliza una ventana normal. No se pueden guardar conteos de forma segura sin IndexedDB.</p><button class="button primary" data-action="reload">Volver a intentar</button></div>`}}
boot();
let adminPolling=false;
setInterval(async()=>{
  const scope=warehouseScope();
  if(adminPolling||!scope.admin||state.page!=='count'||state.scopeLoading||!state.online||!navigator.onLine||document.hidden||!scope.period||!scope.warehouse)return;
  adminPolling=true;
  try{
    const next=await loadAdminView(scope);
    if(sameWarehouseScope(scope)&&next&&Number(next.generation)!==Number(state.adminView?.generation)){
      state.adminView=next;
      await loadRecords(scope);
      if(sameWarehouseScope(scope)&&state.page==='count')SmartSheet.refresh();
    }
  }catch{}finally{adminPolling=false;}
},5000);
setInterval(()=>reconcileCatalogVersion(),15000);

</div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><noscript>Activa JavaScript para utilizar el inventario.</noscript></body></html>
